<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- thundeR lays out its text for Helvetica/Arial widths; DejaVu Sans is wider and makes labels overlap -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
